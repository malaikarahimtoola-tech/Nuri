<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>nuri. Recipe Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #FAF6F0; --warm-beige: #F0E8DC; --border: #E4D9CC;
  --brown: #5C3D2E; --tan: #C4A882;
  --green-dark: #3A6B4A; --rose: #C47A7A;
  --sage: #7A9E7E;
  --text: #2C1810; --text-mid: #6B4D3C; --text-light: #9C7B6A;
  --white: #FFFFFF;
  --shadow: 0 2px 12px rgba(44,24,16,0.08);
  --shadow-md: 0 4px 24px rgba(44,24,16,0.12);
  --radius: 14px; --radius-sm: 8px;
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-logo: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body { background: var(--cream); color: var(--text); font-family: var(--font-body); min-height: 100vh; }
#root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const APPROVED_RDS = [
  { email: 'claire@cpnutrition.com', password: 'claire2025', name: 'Claire Pettitt', id: 3, credentials: 'PhD, RD', avatarColor: '#7A9E7E' },
  { email: 'alysse@nuri.com',        password: 'alysse2025', name: 'Alysse Vocca',  id: 4, credentials: 'RD', avatarColor: '#C47A7A' },
];

const HEALTH_LABELS = [
  { id: 'pcos', label: 'PCOS' },
  { id: 'endometriosis', label: 'Endometriosis' },
  { id: 'hormones', label: 'Hormones' },
  { id: 'fertility', label: 'Fertility' },
  { id: 'gut', label: 'Gut Health' },
  { id: 'thyroid', label: 'Thyroid' },
  { id: 'period', label: 'Period Health' },
  { id: 'energy', label: 'Energy' },
  { id: 'postpartum', label: 'Postpartum' },
  { id: 'menopause', label: 'Menopause' },
  { id: 'anti-inflammatory', label: 'Anti-Inflammatory' },
  { id: 'high-protein', label: 'High Protein' },
];

const GINGHAM_COLORS = [
  { label: 'Sage',  bg: '#A8C4A8', s: 'rgba(58,107,74,0.32)' },
  { label: 'Rose',  bg: '#D9A0A0', s: 'rgba(160,60,60,0.30)' },
  { label: 'Tan',   bg: '#D4B87A', s: 'rgba(140,95,20,0.34)' },
  { label: 'Clay',  bg: '#C8A080', s: 'rgba(140,80,30,0.32)' },
  { label: 'Plum',  bg: '#BBA8CC', s: 'rgba(90,50,130,0.28)' },
  { label: 'Wheat', bg: '#EDD9A3', s: 'rgba(140,95,20,0.28)' },
  { label: 'Blush', bg: '#EDCACA', s: 'rgba(155,52,68,0.30)' },
  { label: 'Sky',   bg: '#B6CAE0', s: 'rgba(20,48,108,0.26)' },
];

const EMOJIS = ['🥗','🍲','🥣','🍳','🥘','🫐','🍞','🥙','🌮','🍜','🥬','🐟','🍛','🫙','🧆','🍵','🥤','🍫','⚡','💜','✨','🌿','🍋','🥑','🎃','🥕','🥞','🍆','🥚','🔴','🍰','🌶️','🍂','🥭','🥜','🌈','🍝'];

function Logo() {
  return (
    <span style={{fontFamily:'var(--font-logo)',fontSize:24,fontStyle:'italic',fontWeight:600,color:'var(--green-dark)',display:'inline-flex',alignItems:'flex-end',lineHeight:1}}>
      nuri<span style={{display:'inline-block',width:7,height:7,borderRadius:'50%',background:'var(--rose)',marginLeft:2,marginBottom:2,flexShrink:0}}/>
    </span>
  );
}

// ── LOGIN ─────────────────────────────────────────────────────
function Login({ onLogin }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');

  const handleLogin = () => {
    const match = APPROVED_RDS.find(
      r => r.email.toLowerCase() === email.trim().toLowerCase() && r.password === password.trim()
    );
    if (match) {
      onLogin(match);
    } else {
      setError('Incorrect email or password.');
      setPassword('');
    }
  };

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--cream)',padding:20}}>
      <div style={{background:'var(--white)',borderRadius:20,padding:48,width:'100%',maxWidth:420,boxShadow:'var(--shadow-md)',textAlign:'center'}}>
        <div style={{fontSize:40,marginBottom:16}}>🌿</div>
        <Logo />
        <div style={{fontFamily:'var(--font-body)',fontSize:11,fontWeight:300,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--tan)',marginTop:6,marginBottom:32}}>
          Recipe Studio
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:12,textAlign:'left'}}>
          <div>
            <label style={{fontSize:11,fontWeight:600,color:'var(--text-mid)',letterSpacing:'0.06em',textTransform:'uppercase',display:'block',marginBottom:6}}>Email</label>
            <input
              type="email"
              value={email}
              onChange={e => { setEmail(e.target.value); setError(''); }}
              onKeyDown={e => e.key === 'Enter' && handleLogin()}
              placeholder="your@email.com"
              style={{width:'100%',padding:'12px 16px',border:`1.5px solid ${error ? '#C0392B' : 'var(--border)'}`,borderRadius:8,fontFamily:'var(--font-body)',fontSize:14,color:'var(--text)',outline:'none',background:'var(--cream)'}}
            />
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:600,color:'var(--text-mid)',letterSpacing:'0.06em',textTransform:'uppercase',display:'block',marginBottom:6}}>Password</label>
            <input
              type="password"
              value={password}
              onChange={e => { setPassword(e.target.value); setError(''); }}
              onKeyDown={e => e.key === 'Enter' && handleLogin()}
              placeholder="••••••••"
              style={{width:'100%',padding:'12px 16px',border:`1.5px solid ${error ? '#C0392B' : 'var(--border)'}`,borderRadius:8,fontFamily:'var(--font-body)',fontSize:14,color:'var(--text)',outline:'none',background:'var(--cream)'}}
            />
          </div>
          {error && <div style={{color:'#C0392B',fontSize:13}}>{error}</div>}
          <button
            onClick={handleLogin}
            style={{width:'100%',padding:14,background:'var(--brown)',color:'white',border:'none',borderRadius:50,fontFamily:'var(--font-body)',fontSize:15,fontWeight:600,cursor:'pointer',marginTop:8,transition:'all 0.2s'}}
          >
            Enter Studio →
          </button>
        </div>
        <p style={{fontSize:12,color:'var(--text-light)',marginTop:16,lineHeight:1.5}}>
          For approved nuri. dietitians only.
        </p>
      </div>
    </div>
  );
}

// ── MAIN STUDIO ───────────────────────────────────────────────
function Studio({ rd, onLogout }) {
  const [tab, setTab] = useState('add');
  const [recipes, setRecipes] = useState(() => {
    try { return JSON.parse(localStorage.getItem('nuri_custom_recipes') || '[]').filter(r => r.dieticianId === rd.id); } catch { return []; }
  });
  const [form, setForm] = useState(emptyForm());
  const [editingId, setEditingId] = useState(null);
  const [toast, setToast] = useState('');

  function emptyForm() {
    return { title:'', subtitle:'', emoji:'🥗', healthLabels:['pcos'], prepTime:'', cookTime:'', servings:'', ginghamBg: GINGHAM_COLORS[0].bg, ginghamS: GINGHAM_COLORS[0].s, photoUrl:'', ingredients:[''], instructions:[''], note:'' };
  }

  function saveToStorage(updated) {
    try {
      const all = JSON.parse(localStorage.getItem('nuri_custom_recipes') || '[]').filter(r => r.dieticianId !== rd.id);
      localStorage.setItem('nuri_custom_recipes', JSON.stringify([...all, ...updated]));
    } catch {}
  }

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(''), 3000);
  }

  function handleSave() {
    if (!form.title.trim()) { alert('Please add a recipe title.'); return; }
    if (!form.healthLabels.length) { alert('Please select at least one health condition.'); return; }
    let updated;
    if (editingId) {
      updated = recipes.map(r => r.id === editingId ? { ...form, id: editingId, dieticianId: rd.id } : r);
      showToast('Recipe updated ✓');
    } else {
      updated = [...recipes, { ...form, id: Date.now(), dieticianId: rd.id }];
      showToast('Recipe added ✓');
    }
    setRecipes(updated);
    saveToStorage(updated);
    setForm(emptyForm());
    setEditingId(null);
    setTab('recipes');
  }

  function handleEdit(r) {
    setForm({ title:r.title||'', subtitle:r.subtitle||'', emoji:r.emoji||'🥗', healthLabels:r.healthLabels||['pcos'], prepTime:r.prepTime||'', cookTime:r.cookTime||'', servings:r.servings||'', ginghamBg:r.ginghamBg||GINGHAM_COLORS[0].bg, ginghamS:r.ginghamS||GINGHAM_COLORS[0].s, photoUrl:r.photoUrl||'', ingredients:r.ingredients?.length?r.ingredients:[''], instructions:r.instructions?.length?r.instructions:[''], note:r.note||'' });
    setEditingId(r.id);
    setTab('add');
    window.scrollTo(0,0);
  }

  function handleDelete(id) {
    if (!confirm('Delete this recipe?')) return;
    const updated = recipes.filter(r => r.id !== id);
    setRecipes(updated);
    saveToStorage(updated);
  }

  const updateForm = (key, val) => setForm(f => ({ ...f, [key]: val }));
  const toggleLabel = id => updateForm('healthLabels', form.healthLabels.includes(id) ? form.healthLabels.filter(l => l !== id) : [...form.healthLabels, id]);
  const updateList = (key, i, val) => { const n = [...form[key]]; n[i] = val; updateForm(key, n); };
  const addToList = key => updateForm(key, [...form[key], '']);
  const removeFromList = (key, i) => updateForm(key, form[key].filter((_,idx) => idx !== i));

  const btnStyle = (active) => ({
    padding:'10px 20px', border:'none', background:'none', fontFamily:'var(--font-body)', fontSize:14, fontWeight: active ? 600 : 500,
    color: active ? 'var(--brown)' : 'var(--text-light)', cursor:'pointer',
    borderBottom: active ? '2px solid var(--brown)' : '2px solid transparent', marginBottom:-1,
  });

  const inputStyle = (extra={}) => ({ padding:'10px 14px', border:'1.5px solid var(--border)', borderRadius:8, background:'var(--white)', fontFamily:'var(--font-body)', fontSize:14, color:'var(--text)', outline:'none', width:'100%', ...extra });
  const labelStyle = { fontSize:11, fontWeight:600, color:'var(--text-mid)', letterSpacing:'0.06em', textTransform:'uppercase', display:'block', marginBottom:6 };
  const sectionStyle = { marginBottom:32 };
  const sectionTitleStyle = { fontFamily:'var(--font-serif)', fontSize:18, fontWeight:600, color:'var(--text)', marginBottom:16, paddingBottom:10, borderBottom:'1px solid var(--border)' };

  return (
    <div style={{minHeight:'100vh',background:'var(--cream)'}}>
      {/* Nav */}
      <nav style={{position:'sticky',top:0,zIndex:100,background:'rgba(250,246,240,0.97)',backdropFilter:'blur(16px)',borderBottom:'1px solid var(--border)',padding:'0 32px',height:64,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <Logo />
          <span style={{width:1,height:20,background:'var(--border)',display:'inline-block'}}/>
          <span style={{fontFamily:'var(--font-body)',fontSize:11,fontWeight:300,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--tan)'}}>Recipe Studio</span>
          <span style={{fontSize:12,color:'var(--text-light)',marginLeft:8}}>👤 {rd.name}</span>
        </div>
        <button onClick={onLogout} style={{padding:'8px 18px',borderRadius:50,border:'1.5px solid var(--border)',background:'transparent',fontFamily:'var(--font-body)',fontSize:13,fontWeight:500,color:'var(--text-mid)',cursor:'pointer'}}>Sign out</button>
      </nav>

      <div style={{maxWidth:900,margin:'0 auto',padding:'40px 24px 80px'}}>
        <div style={{marginBottom:36}}>
          <h1 style={{fontFamily:'var(--font-serif)',fontSize:32,fontStyle:'italic',color:'var(--text)',marginBottom:6}}>
            Welcome, {rd.name.split(' ')[0]} 👋
          </h1>
          <p style={{color:'var(--text-light)',fontSize:14}}>Add and manage your recipes for the nuri. app.</p>
        </div>

        {/* Tabs */}
        <div style={{display:'flex',borderBottom:'1px solid var(--border)',marginBottom:32}}>
          <button style={btnStyle(tab==='add')} onClick={() => { setForm(emptyForm()); setEditingId(null); setTab('add'); }}>
            {editingId ? '✏️ Editing' : '➕ Add Recipe'}
          </button>
          <button style={btnStyle(tab==='recipes')} onClick={() => setTab('recipes')}>
            🗂 My Recipes ({recipes.length})
          </button>
        </div>

        {/* ADD FORM */}
        {tab === 'add' && (
          <div style={{background:'var(--white)',borderRadius:14,padding:32,boxShadow:'var(--shadow)'}}>

            {/* Details */}
            <div style={sectionStyle}>
              <div style={sectionTitleStyle}>🥗 Recipe Details</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
                <div style={{gridColumn:'1/-1'}}>
                  <label style={labelStyle}>Title *</label>
                  <input style={inputStyle()} value={form.title} onChange={e => updateForm('title', e.target.value)} placeholder="e.g. PCOS Berry Hormone Bowl" />
                </div>
                <div style={{gridColumn:'1/-1'}}>
                  <label style={labelStyle}>Subtitle</label>
                  <input style={inputStyle()} value={form.subtitle} onChange={e => updateForm('subtitle', e.target.value)} placeholder="e.g. Inositol-rich & anti-androgenic" />
                </div>
                <div>
                  <label style={labelStyle}>Prep Time</label>
                  <input style={inputStyle()} value={form.prepTime} onChange={e => updateForm('prepTime', e.target.value)} placeholder="e.g. 10 min" />
                </div>
                <div>
                  <label style={labelStyle}>Cook Time</label>
                  <input style={inputStyle()} value={form.cookTime} onChange={e => updateForm('cookTime', e.target.value)} placeholder="e.g. 25 min" />
                </div>
                <div>
                  <label style={labelStyle}>Servings</label>
                  <input style={inputStyle()} value={form.servings} onChange={e => updateForm('servings', e.target.value)} placeholder="e.g. 4" />
                </div>
              </div>
            </div>

            {/* Health Labels */}
            <div style={sectionStyle}>
              <div style={sectionTitleStyle}>🏷️ Health Conditions</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {HEALTH_LABELS.map(l => (
                  <button key={l.id} onClick={() => toggleLabel(l.id)}
                    style={{padding:'7px 14px',borderRadius:50,border:`1.5px solid ${form.healthLabels.includes(l.id) ? 'var(--brown)' : 'var(--border)'}`,background:form.healthLabels.includes(l.id) ? 'var(--warm-beige)' : 'var(--white)',color:form.healthLabels.includes(l.id) ? 'var(--brown)' : 'var(--text-mid)',fontSize:12,fontWeight:form.healthLabels.includes(l.id) ? 600 : 500,cursor:'pointer',fontFamily:'var(--font-body)'}}>
                    {l.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Card Style */}
            <div style={sectionStyle}>
              <div style={sectionTitleStyle}>🎨 Card Style</div>
              <label style={labelStyle}>Emoji</label>
              <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:20}}>
                {EMOJIS.map(e => (
                  <button key={e} onClick={() => updateForm('emoji', e)}
                    style={{width:44,height:44,borderRadius:10,border:`2px solid ${form.emoji===e ? 'var(--brown)' : 'var(--border)'}`,background:form.emoji===e ? 'var(--warm-beige)' : 'var(--white)',fontSize:22,cursor:'pointer'}}>
                    {e}
                  </button>
                ))}
              </div>
              <label style={labelStyle}>Background</label>
              <div style={{display:'flex',flexWrap:'wrap',gap:10}}>
                {GINGHAM_COLORS.map(g => {
                  const sz = 8;
                  const style = {backgroundColor:g.bg,backgroundImage:[`repeating-linear-gradient(transparent 0px,transparent ${sz}px,${g.s} ${sz}px,${g.s} ${sz*2}px)`,`repeating-linear-gradient(90deg,transparent 0px,transparent ${sz}px,${g.s} ${sz}px,${g.s} ${sz*2}px)`].join(',')};
                  return (
                    <div key={g.label} onClick={() => { updateForm('ginghamBg', g.bg); updateForm('ginghamS', g.s); }}
                      style={{width:48,height:36,borderRadius:8,cursor:'pointer',border:`3px solid ${form.ginghamBg===g.bg ? 'var(--brown)' : 'transparent'}`,transition:'all 0.15s',...style}}
                      title={g.label}/>
                  );
                })}
              </div>
            </div>

            {/* Photo */}
            <div style={sectionStyle}>
              <div style={sectionTitleStyle}>📸 Photo URL</div>
              <label style={labelStyle}>Image URL (optional)</label>
              <input style={inputStyle()} value={form.photoUrl} onChange={e => updateForm('photoUrl', e.target.value)} placeholder="https://..." />
              {form.photoUrl && <img src={form.photoUrl} alt="preview" style={{width:'100%',height:160,objectFit:'cover',borderRadius:8,marginTop:10}} onError={e=>e.target.style.display='none'} />}
            </div>

            {/* Ingredients */}
            <div style={sectionStyle}>
              <div style={sectionTitleStyle}>🧾 Ingredients</div>
              {form.ingredients.map((ing, i) => (
                <div key={i} style={{display:'flex',gap:8,marginBottom:8,alignItems:'center'}}>
                  <div style={{width:6,height:6,borderRadius:'50%',background:'var(--tan)',flexShrink:0}}/>
                  <input style={inputStyle()} value={ing} onChange={e => updateList('ingredients', i, e.target.value)} placeholder={`Ingredient ${i+1}`} />
                  {form.ingredients.length > 1 && <button onClick={() => removeFromList('ingredients', i)} style={{width:28,height:28,borderRadius:'50%',border:'1.5px solid var(--border)',background:'white',cursor:'pointer',color:'var(--text-light)',fontSize:14,flexShrink:0}}>×</button>}
                </div>
              ))}
              <button onClick={() => addToList('ingredients')} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 14px',background:'var(--warm-beige)',border:'1.5px dashed var(--border)',borderRadius:8,fontSize:13,color:'var(--text-mid)',cursor:'pointer',fontFamily:'var(--font-body)',width:'100%',marginTop:4}}>
                + Add ingredient
              </button>
            </div>

            {/* Instructions */}
            <div style={sectionStyle}>
              <div style={sectionTitleStyle}>📋 Instructions</div>
              {form.instructions.map((step, i) => (
                <div key={i} style={{display:'flex',gap:8,marginBottom:8,alignItems:'flex-start'}}>
                  <div style={{width:24,height:24,borderRadius:'50%',background:'var(--warm-beige)',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'var(--brown)',flexShrink:0,marginTop:8}}>{i+1}</div>
                  <textarea value={step} onChange={e => updateList('instructions', i, e.target.value)} placeholder={`Step ${i+1}`} style={{...inputStyle(),minHeight:60,resize:'vertical',lineHeight:1.5}} />
                  {form.instructions.length > 1 && <button onClick={() => removeFromList('instructions', i)} style={{width:28,height:28,borderRadius:'50%',border:'1.5px solid var(--border)',background:'white',cursor:'pointer',color:'var(--text-light)',fontSize:14,flexShrink:0,marginTop:8}}>×</button>}
                </div>
              ))}
              <button onClick={() => addToList('instructions')} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 14px',background:'var(--warm-beige)',border:'1.5px dashed var(--border)',borderRadius:8,fontSize:13,color:'var(--text-mid)',cursor:'pointer',fontFamily:'var(--font-body)',width:'100%',marginTop:4}}>
                + Add step
              </button>
            </div>

            {/* Note */}
            <div style={sectionStyle}>
              <div style={sectionTitleStyle}>💡 Dietitian's Note</div>
              <textarea value={form.note} onChange={e => updateForm('note', e.target.value)} placeholder="Add a nutritional note or tip..." style={{...inputStyle(),minHeight:80,resize:'vertical',lineHeight:1.5}} />
            </div>

            {/* Submit */}
            <div style={{display:'flex',gap:12,justifyContent:'flex-end',paddingTop:24,borderTop:'1px solid var(--border)'}}>
              <button onClick={() => { setForm(emptyForm()); setEditingId(null); }} style={{padding:'13px 24px',background:'transparent',border:'1.5px solid var(--border)',color:'var(--text-mid)',borderRadius:50,fontFamily:'var(--font-body)',fontSize:14,cursor:'pointer'}}>
                Clear
              </button>
              <button onClick={handleSave} style={{padding:'13px 36px',background:'var(--brown)',color:'white',border:'none',borderRadius:50,fontFamily:'var(--font-body)',fontSize:15,fontWeight:600,cursor:'pointer'}}>
                {editingId ? 'Save changes ✓' : 'Add to app ✓'}
              </button>
            </div>
          </div>
        )}

        {/* RECIPE LIST */}
        {tab === 'recipes' && (
          <div>
            {recipes.length === 0 ? (
              <div style={{textAlign:'center',padding:80,color:'var(--text-light)'}}>
                <div style={{fontSize:48,marginBottom:16}}>🌱</div>
                <div style={{fontFamily:'var(--font-serif)',fontSize:22,fontStyle:'italic',marginBottom:8}}>No recipes yet</div>
                <div style={{fontSize:14}}>Use the Add Recipe tab to get started.</div>
              </div>
            ) : recipes.map(r => (
              <div key={r.id} style={{background:'var(--white)',borderRadius:12,padding:'18px 20px',display:'flex',alignItems:'center',gap:16,boxShadow:'var(--shadow)',marginBottom:12}}>
                <div style={{fontSize:28,flexShrink:0}}>{r.emoji}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontFamily:'var(--font-serif)',fontSize:17,fontStyle:'italic',fontWeight:600,color:'var(--text)'}}>{r.title}</div>
                  <div style={{fontSize:12,color:'var(--text-light)',marginTop:3}}>{r.prepTime||'?'} prep · {r.servings||'?'} servings</div>
                  <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:6}}>
                    {(r.healthLabels||[]).map(l => {
                      const lbl = HEALTH_LABELS.find(h => h.id === l);
                      return lbl ? <span key={l} style={{padding:'2px 10px',borderRadius:50,fontSize:11,fontWeight:500,background:'var(--warm-beige)',color:'var(--text-mid)'}}>{lbl.label}</span> : null;
                    })}
                  </div>
                </div>
                <button onClick={() => handleEdit(r)} style={{padding:'7px 14px',border:'1.5px solid var(--tan)',borderRadius:50,background:'white',color:'var(--tan)',fontSize:12,fontWeight:500,cursor:'pointer',fontFamily:'var(--font-body)'}}>Edit</button>
                <button onClick={() => handleDelete(r.id)} style={{padding:'7px 14px',border:'1.5px solid var(--border)',borderRadius:50,background:'white',color:'var(--text-light)',fontSize:12,fontWeight:500,cursor:'pointer',fontFamily:'var(--font-body)'}}>Delete</button>
              </div>
            ))}
          </div>
        )}
      </div>

      {toast && (
        <div style={{position:'fixed',bottom:32,right:32,background:'var(--green-dark)',color:'white',padding:'14px 24px',borderRadius:50,fontSize:14,fontWeight:500,boxShadow:'var(--shadow-md)',zIndex:999}}>
          {toast}
        </div>
      )}
    </div>
  );
}

function App() {
  const [rd, setRd] = useState(null);
  return rd ? <Studio rd={rd} onLogout={() => setRd(null)} /> : <Login onLogin={setRd} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
