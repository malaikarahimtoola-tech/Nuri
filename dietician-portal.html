*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.section-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--tan); margin-bottom: 6px; }
.card { background: var(--white); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); margin-bottom: 28px; }

.condition-bar-fill { height: 100%; border-radius: 50px; transition: width 0.6s ease; }

/* ── AUTH ── */
.auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.auth-card { background: var(--white); border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; box-shadow: var(--shadow-md); }
.auth-logo { font-family: var(--font-logo); font-size: 36px; font-style: italic; font-weight: 600; color: var(--green-dark); display: inline-flex; align-items: flex-end; margin-bottom: 4px; }
.auth-logo-dot2 { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--rose); margin-left: 2px; margin-bottom: 3px; }
.auth-subtitle { font-size: 13px; color: var(--text-light); margin-bottom: 28px; }
.auth-error { background: #FFF0F0; border: 1px solid #F4C4C4; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; color: #8B2020; margin-bottom: 14px; }
.auth-gingham2 { height: 6px; background-color: #A8C4A8; background-image: repeating-linear-gradient(90deg, transparent 0px, transparent 16px, rgba(58,107,74,0.4) 16px, rgba(58,107,74,0.4) 32px); border-radius: 20px 20px 0 0; margin: -40px -40px 32px; }
.loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 16px; }
.recipe-list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.recipe-list-row:last-child { border-bottom: none; }
.recipe-list-emoji { font-size: 22px; width: 36px; height: 36px; border-radius: 8px; background: var(--warm-beige); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.recipe-list-info { flex: 1; min-width: 0; }
.recipe-list-title { font-family: var(--font-serif); font-size: 14px; font-style: italic; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recipe-list-meta { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.recipe-list-views { font-size: 11px; color: var(--text-mid); background: var(--warm-beige); padding: 3px 8px; border-radius: 50px; flex-shrink: 0; }
</style>

function getGinghamStyle(id, size = 26) {
  const p = GINGHAM_OPTIONS.find(g => g.id === id) || GINGHAM_OPTIONS[0];
  return {
    backgroundColor: p.bg,
    backgroundImage: [
      `repeating-linear-gradient(transparent 0px,transparent ${size}px,${p.s} ${size}px,${p.s} ${size*2}px)`,
      `repeating-linear-gradient(90deg,transparent 0px,transparent ${size}px,${p.s} ${size}px,${p.s} ${size*2}px)`,
    ].join(','),
  };
}

const HEADING_PREFIX = '## ';
const isHeadingItem = (v) => typeof v === 'string' && v.startsWith(HEADING_PREFIX);

// Renumbers only the non-heading items, so sub-headings don't break step/ingredient counts.
function itemDisplayIndex(items, idx) {
  let n = 0;
  for (let i = 0; i <= idx; i++) { if (!isHeadingItem(items[i])) n++; }
  return n;
}

function ListEditor({ items, onChange, placeholder, numbered, allowHeadings }) {
  const update = (i, v) => { const n=[...items]; n[i]=v; onChange(n); };
  const remove = (i) => onChange(items.filter((_,idx)=>idx!==i));
  const add = () => onChange([...items,'']);
  const addHeading = () => onChange([...items, HEADING_PREFIX]);
  return (
    <div>
      {items.map((item,i) => {
        const heading = allowHeadings && isHeadingItem(item);
        if (heading) {
          return (
            <div key={i} className="list-item-row list-item-row-heading">
              <input className="form-input list-heading-input" value={item.slice(HEADING_PREFIX.length)}
                onChange={e=>update(i, HEADING_PREFIX + e.target.value)} placeholder="Sub-heading, e.g. For the dressing" />
              <button className="remove-btn" onClick={()=>remove(i)}>×</button>
            </div>
          );
        }
        return (
          <div key={i} className="list-item-row">
            {numbered ? <span className="list-num">{itemDisplayIndex(items,i)}</span> : <span className="list-dot"/>}
            <input className="form-input list-item-input" value={item} onChange={e=>update(i,e.target.value)} placeholder={`${placeholder} ${itemDisplayIndex(items,i)}`} />
            <button className="remove-btn" onClick={()=>remove(i)}>×</button>
          </div>
        );
      })}
      <div className="add-btn-row">
        <button className="add-btn" onClick={add}>+ Add {numbered?'step':'ingredient'}</button>
        {allowHeadings && <button className="add-btn add-btn-secondary" onClick={addHeading}>+ Add sub-heading</button>}
      </div>
    </div>
  );
}

function AuthScreen({ onAuth }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const handleSignIn = async () => {
    setError(''); setLoading(true);
    try {
      const { data, error: e } = await db.auth.signInWithPassword({ email: email.trim().toLowerCase(), password });
      if (e) { setError('Incorrect email or password.'); return; }
      const { data: profile } = await db.from('profiles').select('name, role, rd_dietitian_id').eq('id', data.user.id).single();
      if (!['dietitian','admin'].includes(profile?.role)) { setError('This portal is for registered dietitians only.'); await db.auth.signOut(); return; }
      onAuth({ ...data.user, name: profile?.name, role: profile?.role, dietitianId: profile?.rd_dietitian_id || 3 });
    } catch { setError('Something went wrong. Please try again.'); }
    finally { setLoading(false); }
  };

  return (
    <div className="auth-screen">
      <div className="auth-card">
        <div className="auth-gingham2" />
        <div className="auth-logo">nuri<span className="auth-logo-dot2" /></div>
        <div className="auth-subtitle">Dietitian Portal</div>

// ── DASHBOARD ─────────────────────────────────────────────────
function Dashboard({ user, onSignOut }) {
  const [saves, setSaves] = useState([]);
  const [follows, setFollows] = useState(0);
  const [views, setViews] = useState({});
  const [myRecipes, setMyRecipes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [rd, setRd] = useState(null);

  const rdId = parseInt(user.dietitianId, 10);

  const loadData = async () => {
    // Load dietitian data from Supabase
    const { data: rdData } = await db.from('dietitians').select('id, name, credentials, specialty').eq('id', rdId).single();
    if (rdData) setRd(rdData);

    // Load recipes from Supabase for this RD
    const { data: recipesData } = await db.from('recipes').select('id, title, emoji, health_labels').eq('dietitian_id', rdId);
    const recipes = recipesData || [];
    setMyRecipes(recipes);
    const recipeIds = recipes.map(r => r.id);

    // Get saves, follows, views in parallel
    const [{ data: savesData }, { data: followData }, { data: viewsData }] = await Promise.all([
      recipeIds.length ? db.from('saves').select('recipe_id').in('recipe_id', recipeIds) : { data: [] },
      db.from('follows').select('user_id').eq('dietitian_id', rdId),
      recipeIds.length ? db.from('views').select('entity_id').eq('entity_type', 'recipe').in('entity_id', recipeIds.map(String)) : { data: [] },
    ]);

    if (savesData) setSaves(savesData.map(s => parseInt(s.recipe_id, 10)));
    setFollows(followData?.length || 0);
    if (viewsData) {
      const counts = {};
      viewsData.forEach(v => { counts[v.entity_id] = (counts[v.entity_id] || 0) + 1; });
      setViews(counts);
    }
    setLoading(false);
  };

  useEffect(() => { loadData(); }, [rdId]);

  // Refresh when tab becomes visible
  useEffect(() => {
    const handleVisibility = () => { if (document.visibilityState === 'visible') loadData(); };
    document.addEventListener('visibilitychange', handleVisibility);
    return () => document.removeEventListener('visibilitychange', handleVisibility);
  }, [rdId]);

  const totalSaves = saves.length;
  const totalViews = Object.values(views).reduce((a, b) => a + b, 0);

  // Condition breakdown from real recipe data
  const conditionRecipes = {};
  const conditionSaves = {};
  myRecipes.forEach(r => {
    (r.health_labels || []).forEach(l => {
      conditionRecipes[l] = (conditionRecipes[l] || 0) + 1;
      if (saves.includes(r.id)) conditionSaves[l] = (conditionSaves[l] || 0) + 1;
    });
  });

  // Sort recipes by views desc
  const sortedRecipes = [...myRecipes].sort((a, b) => (views[b.id] || 0) - (views[a.id] || 0));

  if (loading || !rd) return <div className="loading"><div style={{ fontFamily:'var(--font-logo)', fontSize:40, fontStyle:'italic', color:'var(--green-dark)' }}>nuri.</div><div style={{ fontSize:13, color:'var(--text-light)' }}>Loading dashboard…</div></div>;

  return (
      <div className="portal-body">
        <div style={{ marginBottom: 32 }}>
          <div className="section-eyebrow">Dietitian Dashboard</div>
          <h1 style={{ fontFamily:'var(--font-serif)', fontSize:36, fontStyle:'italic', fontWeight:600, color:'var(--text)' }}>{rd.name}</h1>
          <div style={{ fontSize:14, color:'var(--text-light)', marginTop:4 }}>{rd.credentials}{rd.specialty ? ` · ${rd.specialty}` : ''}</div>
        </div>

        {/* Stats */}
        <div className="stat-grid">
          {[
            { icon:'📖', num: myRecipes.length, lbl:'Recipes published' },
            { icon:'❤️', num: totalSaves, lbl:'Total saves' },
            { icon:'👥', num: follows, lbl:'Followers' },
            { icon:'👁', num: totalViews, lbl:'Total views' },
          ].map((s,i) => (
            <div key={i} className="stat-tile">
              <div className="stat-tile-icon">{s.icon}</div>
              <div className="stat-tile-num">{s.num}</div>
              <div className="stat-tile-lbl">{s.lbl}</div>
            </div>
          ))}
        </div>

        {/* Revenue placeholder */}
        <div className="card" style={{ marginBottom: 28, borderLeft:'3px solid var(--tan)' }}>
          <div className="section-eyebrow">Revenue</div>
          <div style={{ fontFamily:'var(--font-serif)', fontSize:32, fontStyle:'italic', color:'var(--text-light)', margin:'8px 0 4px' }}>—</div>
          <div style={{ fontSize:13, color:'var(--text-light)' }}>Revenue tracking will be available once subscriptions are enabled.</div>
        </div>

        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:24 }}>
          {/* Condition breakdown */}
          <div className="card">
            <div className="section-eyebrow" style={{ marginBottom:16 }}>Condition breakdown</div>
            {Object.keys(conditionRecipes).length === 0 ? (
              <div style={{ fontSize:13, color:'var(--text-light)' }}>No condition data yet.</div>
            ) : Object.entries(conditionRecipes).sort((a,b) => b[1]-a[1]).map(([id, count]) => {
              const g = HEALTH_TAGS.find(x => x.id === id) || { icon:'🏷', label: id, color:'var(--warm-beige)' };
              const maxCount = Math.max(...Object.values(conditionRecipes), 1);
              const pct = Math.round((count / maxCount) * 100);
              return (
                <div key={id} className="condition-bar">
                  <div className="condition-bar-header">
                    <span className="condition-bar-label">{g.icon} {g.label}</span>
                    <span className="condition-bar-count">{count} recipe{count !== 1 ? 's' : ''}</span>
                  </div>
                  <div className="condition-bar-track">
                    <div className="condition-bar-fill" style={{ width:`${pct}%`, background:`linear-gradient(90deg, ${g?.color||'var(--warm-beige)'}, var(--tan))` }} />
                  </div>
                </div>
              );
            })}
          </div>

          {/* Recipe list */}
          <div className="card">
            <div className="section-eyebrow" style={{ marginBottom:16 }}>Recipes by views</div>
            {sortedRecipes.slice(0, 8).map((r, i) => (
              <div key={r.id} className="recipe-list-row">
                <div className="recipe-list-emoji">{r.emoji || '🍽'}</div>
                <div className="recipe-list-info">
                  <div className="recipe-list-title">{r.title}</div>
                  <div className="recipe-list-meta">{saves.includes(parseInt(r.id,10)) ? '❤️ Saved' : '🤍 Not saved'}</div>
                </div>
                <div className="recipe-list-views">👁 {views[r.id] || 0}</div>
              </div>
            ))}
            {myRecipes.length === 0 && <div style={{ fontSize:13, color:'var(--text-light)' }}>No recipes yet.</div>}
          </div>
        </div>
      </div>
  );
}

// ── RECIPE STUDIO ─────────────────────────────────────────────
function RecipeStudio({ user, onPublish, hideHeader, resumeDraft }) {
  const [title, setTitle] = useState(resumeDraft?.title || '');
  const [subtitle, setSubtitle] = useState(resumeDraft?.subtitle || '');
  const [prepTime, setPrepTime] = useState(resumeDraft && resumeDraft.prep_time !== '—' ? (resumeDraft.prep_time || '') : '');
  const [cookTime, setCookTime] = useState(resumeDraft && resumeDraft.cook_time !== '—' ? (resumeDraft.cook_time || '') : '');
  const [servings, setServings] = useState(resumeDraft?.servings ? String(resumeDraft.servings) : '');
  const [labels, setLabels] = useState(resumeDraft?.health_labels || []);
  const [ingredients, setIngredients] = useState(resumeDraft?.ingredients?.length ? resumeDraft.ingredients : ['','']);
  const [instructions, setInstructions] = useState(resumeDraft?.instructions?.length ? resumeDraft.instructions : ['','']);
  const [note, setNote] = useState(resumeDraft?.note || '');
  const [gingham, setGingham] = useState('sage');
  const [photo, setPhoto] = useState(resumeDraft?.photo || '');
  const [uploadingPhoto, setUploadingPhoto] = useState(false);
  const [photoMsg, setPhotoMsg] = useState('');
  const [showFull, setShowFull] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [savingDraft, setSavingDraft] = useState(false);
  const [draftId, setDraftId] = useState(resumeDraft?.id || null);
  const [draftMsg, setDraftMsg] = useState('');

  const toggleLabel = id => setLabels(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const canPublish = title.trim() && ingredients.some(i=>i.trim() && !isHeadingItem(i)) && instructions.some(i=>i.trim());
  const canSaveDraft = title.trim().length > 0;
  const initials = user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  const handlePhotoUpload = async (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    setUploadingPhoto(true); setPhotoMsg('');
    try {
      const url = await uploadToStorage('recipe-images', `recipe-${user.dietitianId}-${Date.now()}`, file);
      setPhoto(url);
      setPhotoMsg('Photo uploaded ✓');
    } catch(e) { setPhotoMsg('Upload failed: ' + e.message); }
    setUploadingPhoto(false);
  };

  const buildRecipeData = () => ({
    dietitian_id: parseInt(user.dietitianId, 10) || null,
    title: title.trim(),
    subtitle: subtitle.trim(),
    emoji: '🍽',
    photo: photo || null,
    health_labels: labels,
    prep_time: prepTime || '—',
    cook_time: cookTime || '—',
    servings: Number(servings) || 0,
    ingredients: ingredients.filter(Boolean),
    instructions: instructions.filter(Boolean),
    note: note,
  });

  const handleSaveDraft = async () => {
    setSavingDraft(true); setDraftMsg('');
    try {
      const draftData = buildRecipeData();
      if (draftId) {
        const { error } = await db.from('recipe_drafts').update(draftData).eq('id', draftId);
        if (error) throw error;
      } else {
        const { data: insertedData, error } = await db.from('recipe_drafts').insert(draftData).select();
        if (error) throw error;
        if (insertedData?.[0]?.id) setDraftId(insertedData[0].id);
      }
      setDraftMsg('Draft saved ✓ — find it anytime under "My Recipes"');
    } catch(e) {
      setDraftMsg('Error saving draft: ' + e.message);
    }
    setSavingDraft(false);
  };

  const handlePublish = async () => {
    setSubmitting(true);
    try {
      const recipeData = { ...buildRecipeData(), is_published: false };
      const { error } = await db.from('recipes').insert(recipeData).select();
      if (error) {
        alert('Error saving recipe: ' + error.message + '\nCode: ' + error.code);
        setSubmitting(false);
        return;
      }
      // If this recipe started life as a draft, remove it from recipe_drafts now that it's a real recipe.
      if (draftId) {
        await db.from('recipe_drafts').delete().eq('id', draftId);
      }
      setSubmitting(false);
      onPublish();
    } catch(e) {
      alert('Unexpected error: ' + e.message);
      setSubmitting(false);
    }
  };

  return (
    <>
      {!hideHeader && (
        <header className="studio-bar">
          <div className="studio-bar-brand">
            <span className="studio-bar-logo">nuri<span className="studio-bar-logo-dot"/></span>
            <div className="studio-bar-divider"/>
            <span className="studio-bar-title">Recipe Studio</span>
          </div>
          <div className="studio-bar-right">
            {draftMsg && <span style={{fontSize:12,color:draftMsg.startsWith('Error')?'#8B2020':'var(--green-dark)'}}>{draftMsg}</span>}
            <span className="bar-user">👤 {user.name} · {user.creds}</span>
            <button className="bar-btn bar-btn-ghost" disabled={!canSaveDraft||savingDraft} onClick={handleSaveDraft}>
              {savingDraft?'Saving…':draftId?'Update draft':'Save draft'}
            </button>
            <button className="bar-btn bar-btn-primary" disabled={!canPublish||submitting} onClick={handlePublish}>
              {submitting?'Publishing…':'✦ Publish Recipe'}
            </button>
          </div>
        </header>
      )}
      {hideHeader && (
        <div style={{ padding:'12px 32px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'flex-end', alignItems:'center', gap:12, background:'var(--cream)' }}>
          {draftMsg && <span style={{fontSize:12,color:draftMsg.startsWith('Error')?'#8B2020':'var(--green-dark)'}}>{draftMsg}</span>}
          <button className="bar-btn bar-btn-ghost" disabled={!canSaveDraft||savingDraft} onClick={handleSaveDraft}>
            {savingDraft?'Saving…':draftId?'Update draft':'Save draft'}
          </button>
          <button className="bar-btn bar-btn-primary" disabled={!canPublish||submitting} onClick={handlePublish}>
            {submitting?'Publishing…':'✦ Publish Recipe'}
          </button>
        </div>
      )}

      <div className="studio-layout">
        <div className="studio-form-panel">

          <div className="form-section">
            <div className="form-section-head"><span className="form-section-icon">📝</span><span className="form-section-title">Recipe Info</span></div>
            <div className="form-group">
              <label className="form-label">Recipe title *</label>
              <input className="form-input" placeholder="e.g. PCOS Berry Hormone Bowl" value={title} onChange={e=>setTitle(e.target.value)} />
            </div>
            <div className="form-group">
              <label className="form-label">Subtitle</label>
              <input className="form-input" placeholder="e.g. Inositol-rich & anti-androgenic" value={subtitle} onChange={e=>setSubtitle(e.target.value)} />
            </div>
            <div className="form-row">
              <div className="form-group">
                <label className="form-label">Prep time</label>
                <input className="form-input" placeholder="e.g. 15 min" value={prepTime} onChange={e=>setPrepTime(e.target.value)} />
              </div>
              <div className="form-group">
                <label className="form-label">Cook time</label>
                <input className="form-input" placeholder="e.g. 35 min" value={cookTime} onChange={e=>setCookTime(e.target.value)} />
              </div>
            </div>
            <div className="form-group" style={{maxWidth:180}}>
              <label className="form-label">Servings</label>
              <input className="form-input" placeholder="e.g. 4" value={servings} onChange={e=>setServings(e.target.value)} />

          </div>

          <div className="form-section">
            <div className="form-section-head"><span className="form-section-icon">📷</span><span className="form-section-title">Recipe Photo</span></div>
            <div className="photo-tips">
              <div className="photo-tips-example">
                <img src={PHOTO_EXAMPLE_SRC} alt="Example recipe photo" />

              </div>
              <div>

                <ol className="photo-tips-list">
                  <li>Bird's-eye, full plate centered</li>

                  <li>45° angle of the plate</li>
                </ol>
                <div className="photo-tips-note">Good, even lighting makes the biggest difference — shoot near a window if you can.</div>

            </div>
            <div className="photo-upload-row">

            </div>
          </div>

            <div className="label-grid">
              {Object.entries(LABEL_MAP).map(([id,info])=>(
                <button key={id} className={`label-chip ${labels.includes(id)?'active':''}`}
                  style={labels.includes(id)?{background:info.color,color:info.text,borderColor:info.color}:{}}

// ── UPLOAD HELPER ─────────────────────────────────────────────
async function uploadToStorage(bucket, path, file) {
  const { data, error } = await db.storage.from(bucket).upload(path, file, { upsert: true, contentType: file.type });
  if (error) throw error;
  const publicUrl = `https://zgjtibyhuhpibrxcormd.supabase.co/storage/v1/object/public/${bucket}/${path}`;
  return publicUrl;
}

// ── EDIT MY RECIPES ───────────────────────────────────────────
function EditMyRecipes({ user, onResumeDraft }) {
  const [recipes, setRecipes] = useState([]);
  const [selected, setSelected] = useState(null);
  const [saving, setSaving] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [msg, setMsg] = useState('');

  useEffect(() => {
    if (!user.dietitianId) return;
    Promise.all([
      db.from('recipes').select('*').eq('dietitian_id', user.dietitianId).order('id'),
      db.from('recipe_drafts').select('*').eq('dietitian_id', user.dietitianId).order('id'),
    ]).then(([recipesRes, draftsRes]) => {
      const recipeRows = (recipesRes.data || []).map(r => ({ ...r, _source: 'recipe' }));
      const draftRows = (draftsRes.data || []).map(r => ({ ...r, _source: 'draft' }));
      setRecipes([...draftRows, ...recipeRows]);
    });
  }, [user.dietitianId]);

  const handleSave = async () => {
    setSaving(true); setMsg('');
    try {
      const payload = {
        title: selected.title,
        subtitle: selected.subtitle,
        note: selected.note,
        prep_time: selected.prep_time,
        cook_time: selected.cook_time,
        servings: selected.servings,
        health_labels: selected.health_labels,
        ingredients: selected.ingredients,
        instructions: selected.instructions,
        photo: selected.photo,
      };
      const { data, error } = await db.from('recipes').update(payload).eq('id', selected.id).select();
      if (error) throw error;
      setRecipes(rs => rs.map(r => (r.id === selected.id && r._source === selected._source) ? selected : r));
      setMsg('Saved ✓');
    } catch(e) { setMsg('Error: ' + e.message); console.error('Save error:', e); }
    setSaving(false);
  };

  const handlePhotoUpload = async (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    setUploading(true); setMsg('');
    try {
      const url = await uploadToStorage('recipe-images', `recipe-${selected.id}-${Date.now()}`, file);
      setSelected(s => ({ ...s, photo: url }));
      setMsg('Photo uploaded ✓ — click Save to apply');
    } catch(e) { setMsg('Upload failed: ' + e.message); }
    setUploading(false);
  };

  const handleDeleteDraft = async (draft) => {
    if (!confirm(`Delete the draft "${draft.title}"? This can't be undone.`)) return;
    try {
      const { error } = await db.from('recipe_drafts').delete().eq('id', draft.id);
      if (error) throw error;
      setRecipes(rs => rs.filter(r => !(r.id === draft.id && r._source === 'draft')));
    } catch(e) { alert('Error deleting draft: ' + e.message); }
  };

  const statusOf = (r) => r._source === 'draft' ? { label: 'Draft', cls: 'status-draft' } : r.is_published ? { label: 'Published', cls: 'status-published' } : { label: 'Pending review', cls: 'status-pending' };

  return (
    <div className="portal-body">
      <div style={{marginBottom:32}}>
        <div className="section-eyebrow">Content</div>
        <h1 style={{fontFamily:'var(--font-serif)',fontSize:32,fontStyle:'italic',fontWeight:600,color:'var(--text)'}}>Edit My Recipes</h1>
        <p style={{fontSize:14,color:'var(--text-light)',marginTop:8}}>{recipes.length} recipes — click any to edit</p>
      </div>

      {recipes.length === 0 ? (
        <div style={{background:'var(--white)',borderRadius:'var(--radius)',padding:40,textAlign:'center',boxShadow:'var(--shadow)'}}>
          <div style={{fontSize:32,marginBottom:12}}>🍽</div>
          <div style={{fontFamily:'var(--font-serif)',fontSize:18,fontStyle:'italic',color:'var(--text)',marginBottom:8}}>No recipes yet</div>
          <div style={{fontSize:14,color:'var(--text-light)'}}>Use the Create Recipe tab to add your first recipe.</div>
        </div>
      ) : (
        <div style={{display:'grid',gridTemplateColumns:selected?'260px 1fr':'repeat(auto-fill,minmax(220px,1fr))',gap:20,alignItems:'start'}}>
          <div style={{background:'var(--white)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)',overflow:'hidden'}}>
            {recipes.map(r => (
              <div key={`${r._source}-${r.id}`} onClick={() => { r._source === 'draft' ? onResumeDraft(r) : setSelected({...r}); setMsg(''); }} style={{
                padding:'12px 16px',cursor:'pointer',borderBottom:'1px solid var(--border)',
                background:(selected?.id===r.id && selected?._source===r._source)?'var(--warm-beige)':'transparent',
                display:'flex',alignItems:'center',gap:10,
              }}>
                {r.photo ? <img src={r.photo} style={{width:32,height:32,borderRadius:6,objectFit:'cover',flexShrink:0}} onError={e=>e.target.style.display='none'} /> : <div style={{width:32,height:32,borderRadius:6,background:'var(--warm-beige)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>{r.emoji||'🍽'}</div>}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontFamily:'var(--font-serif)',fontSize:13,fontStyle:'italic',fontWeight:600,color:'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.title}</div>
                  <span className={`status-badge ${statusOf(r).cls}`} style={{marginTop:4}}>{statusOf(r).label}</span>
                </div>
                {r._source === 'draft' && (
                  <button onClick={(e) => { e.stopPropagation(); handleDeleteDraft(r); }} title="Delete draft"
                    style={{flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',width:26,height:26,borderRadius:'50%',background:'none',border:'1.5px solid var(--border)',color:'#8B2020',cursor:'pointer',fontSize:14,lineHeight:1,padding:0}}
                    onMouseEnter={e=>{e.currentTarget.style.background='#F4C4C4';e.currentTarget.style.borderColor='#8B2020';}}
                    onMouseLeave={e=>{e.currentTarget.style.background='none';e.currentTarget.style.borderColor='var(--border)';}}>
                    🗑
                  </button>
                )}
              </div>
            ))}
          </div>

          {selected && (
            <div style={{background:'var(--white)',borderRadius:'var(--radius)',padding:28,boxShadow:'var(--shadow)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20,flexWrap:'wrap',gap:10}}>
                <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                  <div style={{fontFamily:'var(--font-serif)',fontSize:18,fontStyle:'italic',fontWeight:600,color:'var(--text)'}}>Editing: {selected.title}</div>
                  <span className={`status-badge ${statusOf(selected).cls}`}>{statusOf(selected).label}</span>
                </div>
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  {msg && <span style={{fontSize:13,color:msg.includes('Error')||msg.includes('failed')?'#8B2020':'var(--green-dark)'}}>{msg}</span>}
                  <button onClick={() => setSelected(null)} style={{padding:'8px 14px',border:'1.5px solid var(--border)',borderRadius:50,background:'none',fontFamily:'var(--font-body)',fontSize:13,cursor:'pointer'}}>Cancel</button>
                  <button onClick={handleSave} disabled={saving} style={{padding:'8px 18px',background:'var(--brown)',color:'white',border:'none',borderRadius:50,fontFamily:'var(--font-body)',fontSize:13,fontWeight:600,cursor:'pointer',opacity:saving?0.6:1}}>
                    {saving?'Saving…':'Save'}
                  </button>
                </div>
              </div>

              {/* Photo */}
              <div style={{marginBottom:18}}>
                <div className="section-eyebrow" style={{marginBottom:8}}>Recipe photo</div>
                <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
                  {selected.photo && <img src={selected.photo} style={{width:72,height:72,borderRadius:10,objectFit:'cover'}} onError={e=>e.target.style.display='none'} />}
                  <label style={{padding:'9px 18px',background:'var(--warm-beige)',border:'1.5px solid var(--border)',borderRadius:50,fontFamily:'var(--font-body)',fontSize:13,cursor:'pointer',fontWeight:500}}>
                    {uploading?'Uploading…':selected.photo?'↺ Replace photo':'+ Upload photo'}
                    <input type="file" accept="image/*" onChange={handlePhotoUpload} style={{display:'none'}} disabled={uploading} />
                  </label>
                  {selected.photo && <button onClick={() => setSelected(s=>({...s,photo:null}))} style={{fontSize:12,color:'var(--text-light)',background:'none',border:'none',cursor:'pointer'}}>Remove</button>}
                </div>
              </div>

              {[{label:'Title',key:'title'},{label:'Subtitle',key:'subtitle'},{label:'Prep time',key:'prep_time'},{label:'Cook time',key:'cook_time'}].map(f => (
                <div key={f.key} style={{marginBottom:12}}>
                  <div className="section-eyebrow" style={{marginBottom:5}}>{f.label}</div>
                  <input value={selected[f.key]||''} onChange={e=>setSelected(s=>({...s,[f.key]:e.target.value}))}
                    style={{width:'100%',padding:'9px 12px',border:'1.5px solid var(--border)',borderRadius:8,fontFamily:'var(--font-body)',fontSize:14,color:'var(--text)',background:'var(--cream)',outline:'none'}} />
                </div>
              ))}

              <div style={{marginBottom:12}}>
                <div className="section-eyebrow" style={{marginBottom:6}}>Health labels</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                  {HEALTH_TAGS.map(g => {
                    const active=(selected.health_labels||[]).includes(g.id);
                    return <button key={g.id} onClick={()=>setSelected(s=>({...s,health_labels:active?s.health_labels.filter(x=>x!==g.id):[...(s.health_labels||[]),g.id]}))}
                      style={{padding:'3px 10px',borderRadius:50,border:`1.5px solid ${active?'var(--brown)':'var(--border)'}`,background:active?'var(--brown)':'transparent',color:active?'white':'var(--text-mid)',fontFamily:'var(--font-body)',fontSize:11,cursor:'pointer'}}>
                      {g.label}
                    </button>;
                  })}
                </div>
              </div>

              <div style={{marginBottom:12}}>
                <div className="section-eyebrow" style={{marginBottom:5}}>Note</div>
                <textarea value={selected.note||''} onChange={e=>setSelected(s=>({...s,note:e.target.value}))} rows={2}
                  style={{width:'100%',padding:'9px 12px',border:'1.5px solid var(--border)',borderRadius:8,fontFamily:'var(--font-body)',fontSize:13,color:'var(--text)',background:'var(--cream)',outline:'none',resize:'vertical'}} />
              </div>

              <div style={{marginBottom:12}}>
                <div className="section-eyebrow" style={{marginBottom:5}}>Ingredients (one per line)</div>
                <div style={{fontSize:11,color:'var(--text-light)',marginBottom:5}}>Tip: start a line with "## " to add a sub-heading, e.g. "## For the dressing"</div>
                <textarea value={(selected.ingredients||[]).join('\n')} onChange={e=>setSelected(s=>({...s,ingredients:e.target.value.split('\n')}))} rows={5}
                  style={{width:'100%',padding:'9px 12px',border:'1.5px solid var(--border)',borderRadius:8,fontFamily:'var(--font-body)',fontSize:13,color:'var(--text)',background:'var(--cream)',outline:'none',resize:'vertical'}} />
              </div>

              <div>
                <div className="section-eyebrow" style={{marginBottom:5}}>Instructions (one per line)</div>
                <textarea value={(selected.instructions||[]).join('\n')} onChange={e=>setSelected(s=>({...s,instructions:e.target.value.split('\n')}))} rows={7}
                  style={{width:'100%',padding:'9px 12px',border:'1.5px solid var(--border)',borderRadius:8,fontFamily:'var(--font-body)',fontSize:13,color:'var(--text)',background:'var(--cream)',outline:'none',resize:'vertical'}} />
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ProfileSettings({ user }) {
  const [photo, setPhoto] = useState('');
  const [bio, setBio] = useState('');
  const [uploading, setUploading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');

  useEffect(() => {
    db.from('dietitians').select('photo, bio').eq('id', user.dietitianId).single().then(({ data }) => {
      if (data) { setPhoto(data.photo || ''); setBio(data.bio || ''); }
    });
  }, [user.dietitianId]);

  const handlePhotoUpload = async (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    setUploading(true); setMsg('');
    try {
      const url = await uploadToStorage('dietitian-avatars', `dietitian-${user.dietitianId}-${Date.now()}`, file);
      setPhoto(url);
      setMsg('Photo uploaded ✓ — click Save to apply');
    } catch(e) { setMsg('Upload failed: ' + e.message); }
    setUploading(false);
  };

  const handleSave = async () => {
    setSaving(true); setMsg('');
    try {
      await db.from('dietitians').update({ photo, bio }).eq('id', user.dietitianId);
      setMsg('Saved ✓');
    } catch(e) { setMsg('Error saving'); }
    setSaving(false);
  };

  return (
    <div className="portal-body">
      <div style={{marginBottom:32}}>
        <div className="section-eyebrow">Account</div>
        <h1 style={{fontFamily:'var(--font-serif)',fontSize:32,fontStyle:'italic',fontWeight:600,color:'var(--text)'}}>Profile Settings</h1>
      </div>
      <div style={{background:'var(--white)',borderRadius:'var(--radius)',padding:32,boxShadow:'var(--shadow)',maxWidth:560}}>
        <div style={{marginBottom:24}}>
          <div className="section-eyebrow" style={{marginBottom:10}}>Profile photo</div>
          <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
            {photo ? (
              <img src={photo} style={{width:72,height:72,borderRadius:'50%',objectFit:'cover',border:'3px solid var(--border)'}} />
            ) : (
              <div style={{width:72,height:72,borderRadius:'50%',background:'var(--warm-beige)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,border:'3px solid var(--border)'}}>👤</div>
            )}
            <label style={{padding:'10px 20px',background:'var(--warm-beige)',border:'1.5px solid var(--border)',borderRadius:50,fontFamily:'var(--font-body)',fontSize:13,cursor:'pointer',fontWeight:500}}>
              {uploading ? 'Uploading…' : photo ? '↺ Replace photo' : '+ Upload photo'}
              <input type="file" accept="image/*" onChange={handlePhotoUpload} style={{display:'none'}} disabled={uploading} />
            </label>
            {photo && (
              <button onClick={async () => {
                setPhoto('');
                await db.from('dietitians').update({ photo: null }).eq('id', user.dietitianId);
                setMsg('Photo removed ✓');
              }} style={{padding:'10px 20px',background:'none',border:'1.5px solid #F4C4C4',borderRadius:50,fontFamily:'var(--font-body)',fontSize:13,cursor:'pointer',color:'#8B2020',fontWeight:500}}>
                Remove photo
              </button>
            )}
          </div>
        </div>

        <div style={{marginBottom:24}}>
          <div className="section-eyebrow" style={{marginBottom:8}}>Bio</div>
          <textarea value={bio} onChange={e => setBio(e.target.value)} rows={5} placeholder="Write your bio..."
            style={{width:'100%',padding:'12px 16px',border:'1.5px solid var(--border)',borderRadius:10,fontFamily:'var(--font-body)',fontSize:14,color:'var(--text)',background:'var(--cream)',outline:'none',resize:'vertical'}} />
        </div>

        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <button onClick={handleSave} disabled={saving} style={{padding:'12px 28px',background:'var(--brown)',color:'white',border:'none',borderRadius:50,fontFamily:'var(--font-body)',fontSize:14,fontWeight:600,cursor:'pointer',opacity:saving?0.6:1}}>
            {saving ? 'Saving…' : 'Save changes'}
          </button>
          {msg && <span style={{fontSize:13,color:msg.includes('Error')||msg.includes('failed')?'#8B2020':'var(--green-dark)'}}>{msg}</span>}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('create');
  const [published, setPublished] = useState(false);
  const [rdData, setRdData] = useState(null);
  const [resumeDraft, setResumeDraft] = useState(null);

  useEffect(() => {
    const init = async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session?.user) {
        const u = session.user;
        const { data: profile } = await db.from('profiles').select('name, role, rd_dietitian_id').eq('id', u.id).single();
        if (['dietitian','admin'].includes(profile?.role)) {
          const dietitianId = profile.rd_dietitian_id;
          const { data: rd } = dietitianId
            ? await db.from('dietitians').select('id, name, credentials, specialty').eq('id', dietitianId).single()
            : { data: null };
          if (rd) setRdData(rd);
          setUser({ ...u, name: profile.name, role: profile.role, dietitianId });
        }
      }
      setLoading(false);
    };
    init();
    const { data: { subscription } } = db.auth.onAuthStateChange(event => {
      if (event === 'SIGNED_OUT') setUser(null);
    });
    return () => subscription.unsubscribe();
  }, []);

  const handleSignOut = async () => { await db.auth.signOut(); setUser(null); };
  const handleResumeDraft = (draft) => { setResumeDraft(draft); setPublished(false); setTab('create'); };

  if (loading) return <div className="loading"><div style={{ fontFamily:'var(--font-logo)', fontSize:48, fontStyle:'italic', color:'var(--green-dark)' }}>nuri.</div></div>;
  if (!user) return <AuthScreen onAuth={async (u) => {
    const { data: rd } = u.dietitianId
      ? await db.from('dietitians').select('id, name, credentials, specialty').eq('id', u.dietitianId).single()
      : { data: null };
    if (rd) setRdData(rd);
    setUser(u);
  }} />;

  return (
    <>
      <nav className="portal-nav">
        <div className="portal-nav-inner">
          <div className="portal-logo">nuri<span className="portal-logo-dot" /></div>
          <div className="portal-nav-tabs">
            <button className={`portal-nav-tab ${tab==='dashboard'?'active':''}`} onClick={() => { setTab('dashboard'); setPublished(false); }}>📊 Dashboard</button>
            <button className={`portal-nav-tab ${tab==='create'?'active':''}`} onClick={() => { setTab('create'); setPublished(false); setResumeDraft(null); }}>✦ Create Recipe</button>
            <button className={`portal-nav-tab ${tab==='edit'?'active':''}`} onClick={() => { setTab('edit'); setPublished(false); }}>✏️ My Recipes</button>
            <button className={`portal-nav-tab ${tab==='profile'?'active':''}`} onClick={() => { setTab('profile'); setPublished(false); }}>👤 My Profile</button>
          </div>
          <div className="portal-nav-right">
            <span className="portal-user">👋 {user.name || user.email?.split('@')[0]}</span>
            <button className="portal-signout" onClick={handleSignOut}>Sign out</button>
          </div>
        </div>
      </nav>
      {tab === 'dashboard' && <Dashboard user={user} onSignOut={handleSignOut} />}
      {tab === 'edit' && <EditMyRecipes user={user} onResumeDraft={handleResumeDraft} />}
      {tab === 'profile' && <ProfileSettings user={user} />}
      {tab === 'create' && !published && <RecipeStudio user={{ name: user.name || rdData?.name, email: user.email, creds: rdData?.credentials || 'RD', dietitianId: user.dietitianId }} onPublish={() => { setPublished(true); setResumeDraft(null); }} hideHeader={true} resumeDraft={resumeDraft} />}
      {tab === 'create' && published && <SuccessPage user={{ name: user.name, email: user.email }} onAnother={() => setPublished(false)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
